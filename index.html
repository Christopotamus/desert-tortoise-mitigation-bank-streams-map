      for (k = 0; k < 2; k++) {
        var shift = 0, res = 0, b;
        do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        v.push((res & 1) ? ~(res >> 1) : (res >> 1));
      }
      lat += v[0]; lng += v[1];
      pts.push([lat / 1e7, lng / 1e7]);   // Leaflet wants [lat, lng]
    }
    return pts;
  }

  var map = L.map('dtcb-map', {
    scrollWheelZoom: false,
    preferCanvas: true      // canvas renderer: ~29k vertices stay smooth on mobile
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    subdomains: [],         // policy requires the single canonical host
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var group = L.featureGroup();

  DATA.forEach(function (f) {
    var ring = decode(f.b, f.poly);
    if (ring.length !== f.n) { console.warn('vertex count mismatch', f.name, ring.length, f.n); }
    L.polygon(ring, {
      color: '#1e8c3c',       // matches the KML LineStyle
      weight: 2,
      fillColor: '#a0c878',   // matches the KML PolyStyle
      fillOpacity: 0.45
    }).bindPopup('<strong>' + f.name + '</strong>').addTo(group);
  });

  group.addTo(map);
  map.fitBounds(group.getBounds(), { padding: [20, 20] });
  map.once('click', function () { map.scrollWheelZoom.enable(); });
})();
</script>

</body>
</html>
